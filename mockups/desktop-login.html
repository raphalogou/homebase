body{margin:0}

<div style="position:relative;min-height:900px;box-sizing:border-box;background:#F2F3EF;color:#15191A;font-family:'Schibsted Grotesk',system-ui,sans-serif;display:flex;flex-wrap:wrap;align-items:stretch">
<div style="flex:1 1 100%;min-height:900px;box-sizing:border-box;padding:64px 24px"><div style="max-width:380px;margin:0 auto"><div style="font-size:28px;font-weight:700;letter-spacing:-0.02em"><span style="box-shadow:inset 0 -0.5em 0 #F2E94E;color:#15191A">Homebase</span></div><h1 style="margin:32px 0 0;font-size:46px;line-height:1.05;font-weight:700;letter-spacing:-0.025em">Log in</h1><p style="margin:10px 0 8px;font-size:16px;line-height:1.5;color:#5E655F">Enter your username and passphrase.</p><label style="display:block;margin-top:22px"><span style="display:block;font-size:14px;font-weight:500;color:#5E655F;margin-bottom:6px">Username</span><input type="text" value="" placeholder="" autocomplete="username" style="width:100%;height:52px;box-sizing:border-box;border:1px solid #868D87;border-radius:12px;background:#FAFAF8;padding:0 14px;font:inherit;font-size:16px;color:#15191A"></label><div style="margin-top:18px"><label style="display:block;font-size:14px;font-weight:500;color:#5E655F;margin-bottom:6px">Passphrase<span style="display:flex;align-items:center;border:1px solid #868D87;border-radius:12px;background:#FAFAF8;height:52px;box-sizing:border-box;margin-top:6px"><input type="password" value="" autocomplete="current-password" style="flex:1;min-width:0;height:100%;border:0;background:transparent;padding:0 4px 0 14px;font:inherit;font-size:16px;color:#15191A"><button type="button" aria-label="Show passphrase" aria-pressed="false" style="flex:none;width:44px;height:44px;border:0;background:none;color:#5E655F;display:grid;place-items:center;padding:0;margin-right:3px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg></button></span></label></div><a href="#top" style="display:flex;align-items:center;justify-content:center;height:52px;margin-top:28px;border-radius:12px;background:#15191A;color:#F2F3EF;font-weight:600;font-size:16px">Log in</a></div></div>
</div>
