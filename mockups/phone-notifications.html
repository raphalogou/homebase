<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notifications on Android</title>

<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
</style>

<style>html{background:#CBCEC8}body{display:flex;justify-content:center}.frame{width:390px;flex:none}</style>
</head>
<body>
<div class="frame"><div style="width:390px;height:560px;position:relative;overflow:hidden;box-sizing:border-box;background:#F2F3EF;color:#15191A;font-family:'Schibsted Grotesk',system-ui,sans-serif">
<div style="position:absolute;inset:0;background:#1B1C1F;padding:28px 14px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;font-family:'Schibsted Grotesk',system-ui,sans-serif">
<div style="background:#2E3034;border-radius:22px;padding:14px 16px 16px;display:flex;gap:12px"><div style="flex:none;width:28px;height:28px;border-radius:8px;background:#F2F3EF;color:#15191A;display:grid;place-items:center;margin-top:1px"><span style="box-shadow:inset 0 -0.45em 0 #F2E94E;font-weight:700;font-size:15px;line-height:1.1">H</span></div><div style="min-width:0"><div style="font-size:12px;color:#B7BCC4">Homebase, 08:00</div><div style="font-size:16px;font-weight:600;color:#FFFFFF;margin-top:4px;line-height:1.3">Run a half marathon in spring</div><div style="font-size:14px;color:#D6DAE0;margin-top:2px;line-height:1.4">Today: Easy 5 km run; Fix the import bug.</div></div></div>
<div style="background:#2E3034;border-radius:22px;padding:14px 16px 16px;display:flex;gap:12px"><div style="flex:none;width:28px;height:28px;border-radius:8px;background:#F2F3EF;color:#15191A;display:grid;place-items:center;margin-top:1px"><span style="box-shadow:inset 0 -0.45em 0 #F2E94E;font-weight:700;font-size:15px;line-height:1.1">H</span></div><div style="min-width:0"><div style="font-size:12px;color:#B7BCC4">Homebase, 13:00</div><div style="font-size:16px;font-weight:600;color:#FFFFFF;margin-top:4px;line-height:1.3">Midday check</div><div style="font-size:14px;color:#D6DAE0;margin-top:2px;line-height:1.4">1 of 2 done. Next: Fix the import bug.</div></div></div>
<div style="background:#2E3034;border-radius:22px;padding:14px 16px 16px;display:flex;gap:12px"><div style="flex:none;width:28px;height:28px;border-radius:8px;background:#F2F3EF;color:#15191A;display:grid;place-items:center;margin-top:1px"><span style="box-shadow:inset 0 -0.45em 0 #F2E94E;font-weight:700;font-size:15px;line-height:1.1">H</span></div><div style="min-width:0"><div style="font-size:12px;color:#B7BCC4">Homebase, 20:00</div><div style="font-size:16px;font-weight:600;color:#FFFFFF;margin-top:4px;line-height:1.3">Close the day</div><div style="font-size:14px;color:#D6DAE0;margin-top:2px;line-height:1.4">1 of 2 done. Move the rest or let it go.</div></div></div>
</div>
</div></div>
</body>
</html>
