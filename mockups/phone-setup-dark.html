<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set up</title>

<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
</style>

<style>html{background:#0B0D0C}body{display:flex;justify-content:center}.frame{width:390px;flex:none}</style>
</head>
<body>
<div class="frame"><div style="width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box;background:#121514;color:#ECEFEA;font-family:'Schibsted Grotesk',system-ui,sans-serif">
<div style="position:absolute;inset:0;padding:20px 24px 0;box-sizing:border-box;overflow:hidden"><div style="font-size:24px;font-weight:700;letter-spacing:-0.02em"><span style="box-shadow:inset 0 -0.5em 0 #6E6616;color:#ECEFEA">Homebase</span></div><h1 style="margin:28px 0 0;font-size:36px;line-height:1.1;font-weight:700;letter-spacing:-0.02em">Set up Homebase</h1><p style="margin:10px 0 8px;font-size:16px;line-height:1.5;color:#9AA29C">Choose how you will log in. There is one account, just for you.</p><label style="display:block;margin-top:22px"><span style="display:block;font-size:14px;font-weight:500;color:#9AA29C;margin-bottom:6px">Username</span><input type="text" value="" placeholder="Letters, numbers, dots and dashes" autocomplete="username" style="width:100%;height:52px;box-sizing:border-box;border:1px solid #6A736D;border-radius:12px;background:#1A1E1D;padding:0 14px;font:inherit;font-size:16px;color:#ECEFEA"></label><div style="margin-top:18px"><label style="display:block;font-size:14px;font-weight:500;color:#9AA29C;margin-bottom:6px">Passphrase<span style="display:flex;align-items:center;border:1px solid #6A736D;border-radius:12px;background:#1A1E1D;height:52px;box-sizing:border-box;margin-top:6px"><input type="password" value="" autocomplete="new-password" style="flex:1;min-width:0;height:100%;border:0;background:transparent;padding:0 4px 0 14px;font:inherit;font-size:16px;color:#ECEFEA"><button type="button" aria-label="Show passphrase" aria-pressed="false" style="flex:none;width:44px;height:44px;border:0;background:none;color:#9AA29C;display:grid;place-items:center;padding:0;margin-right:3px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg></button></span></label><div style="font-size:13px;color:#9AA29C;margin-top:6px;line-height:1.4">At least 12 characters. Several random words work well.</div></div><div style="margin-top:18px"><label style="display:block;font-size:14px;font-weight:500;color:#9AA29C;margin-bottom:6px">Confirm passphrase<span style="display:flex;align-items:center;border:1px solid #6A736D;border-radius:12px;background:#1A1E1D;height:52px;box-sizing:border-box;margin-top:6px"><input type="password" value="" autocomplete="new-password" style="flex:1;min-width:0;height:100%;border:0;background:transparent;padding:0 4px 0 14px;font:inherit;font-size:16px;color:#ECEFEA"><button type="button" aria-label="Show passphrase" aria-pressed="false" style="flex:none;width:44px;height:44px;border:0;background:none;color:#9AA29C;display:grid;place-items:center;padding:0;margin-right:3px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg></button></span></label></div><a href="#top" style="display:flex;align-items:center;justify-content:center;height:52px;margin-top:28px;border-radius:12px;background:#ECEFEA;color:#121514;font-weight:600;font-size:16px">Create account</a><div style="font-size:13px;color:#9AA29C;margin-top:6px;line-height:1.4">You can change both later in Settings.</div></div>
</div></div>
</body>
</html>
