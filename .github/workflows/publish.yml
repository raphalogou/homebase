# Tests every push and pull request. Pushes to main publish
# ghcr.io/<owner>/homebase:latest and :sha-<short> for amd64 and arm64; a
# tag like v1.2.0 publishes :1.2.0 instead of :latest. Plain docker
# commands, so no third-party actions.
name: CI and image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make ci

  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for git describe
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=(-t "$image:sha-${GITHUB_SHA::7}")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags+=(-t "$image:${GITHUB_REF_NAME#v}")
          else
            tags+=(-t "$image:latest")
          fi
          # The default builder cannot hold two platforms; this one can.
          docker buildx create --use --driver docker-container
          docker buildx build --push --platform linux/amd64,linux/arm64 \
            -f deploy/Dockerfile "${tags[@]}" \
            --build-arg VERSION="$(git describe --tags --always)" \
            --build-arg COMMIT="${GITHUB_SHA::7}" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
